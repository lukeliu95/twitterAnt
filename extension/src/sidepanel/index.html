<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Money Signal</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: #15202b;
      color: #ffffff;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      max-width: 400px;
      margin: 0 auto;
    }

    .header {
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #38444d;
    }

    .header h1 {
      font-size: 20px;
      font-weight: 700;
      color: #1fa1f1;
    }

    .header p {
      font-size: 14px;
      color: #8899a6;
      margin-top: 4px;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #8899a6;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      opacity: 0.5;
    }

    .loading-state {
      text-align: center;
      padding: 40px 20px;
      color: #8899a6;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #38444d;
      border-top-color: #1fa1f1;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Money Signal</h1>
      <p>从 Twitter 发现赚钱机会</p>
    </div>

    <div id="app">
      <div class="empty-state">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
        <p>正在加载信号...</p>
      </div>
    </div>
  </div>

  <script type="module" src="./main.ts"></script>
</body>
</html>
